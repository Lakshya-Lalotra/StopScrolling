name: Publish release

# Builds the APK and publishes it under Releases.
# - On a push to the default branch: publishes the current version, if it has no release yet.
#   (Bump versionName in app/build.gradle.kts and add a section to CHANGELOG.md.)
# - By hand (Actions → Publish release → Run workflow): publish a list of versions from any commits.
on:
  push:
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      releases:
        description: 'Optional JSON list, e.g. [{"tag":"v4.0","ref":"<commit>","latest":true}]. Empty = the current version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.releases }}
        run: |
          if [ -n "$INPUT" ]; then
            matrix=$(printf '%s' "$INPUT" | jq -c .)
          else
            version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$version is already published."
              matrix='[]'
            else
              matrix=$(jq -cn --arg tag "v$version" --arg ref "$GITHUB_SHA" '[{tag: $tag, ref: $ref, latest: true}]')
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Release notes come from this branch's CHANGELOG, the code from the commit being released.
      - uses: actions/checkout@v4
        with:
          path: meta
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.release.ref }}
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: src
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.release.tag }}
          LATEST: ${{ matrix.release.latest }}
        run: |
          sha=$(git -C src rev-parse HEAD)
          version=$(grep -oP 'versionName = "\K[^"]+' src/app/build.gradle.kts)
          apk="ScrollStop-$version.apk"
          cp src/app/build/outputs/apk/release/app-release.apk "$apk"

          awk -v v="$version" '/^## /{on = ($2 == v); next} on' meta/CHANGELOG.md > notes.md
          printf '\n**Install:** download `%s` below and open it on your phone. It installs over any version from 2.0 up and keeps your settings. If Play Protect blocks it, see the README.\n' "$apk" >> notes.md

          latest=false
          [ "$LATEST" = "true" ] && latest=true
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "ScrollStop $version" --notes-file notes.md --latest=$latest -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$apk" --target "$sha" --title "ScrollStop $version" --notes-file notes.md --latest=$latest -R "$GITHUB_REPOSITORY"
          fi
